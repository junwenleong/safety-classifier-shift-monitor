[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-detection-monitor"
version = "0.1.0"
description = "Online monitoring system for distributional shift in deployed safety classifiers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.82",
    "pytest-xdist>=3.3",
]
inference = [
    "torch>=2.0",
    "transformers>=4.33",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
]
